<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Migratory birds in flight over a hill country landscape</title>
  <desc id="desc">A group of colorful migratory birds flying through wind lines above green hills at sunrise.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f4ef"/>
      <stop offset="0.48" stop-color="#f8eed1"/>
      <stop offset="1" stop-color="#d4e7e6"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" x2="1">
      <stop offset="0" stop-color="#47785d"/>
      <stop offset="1" stop-color="#2f604d"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" x2="1">
      <stop offset="0" stop-color="#1d554f"/>
      <stop offset="1" stop-color="#173f47"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#15372e" flood-opacity=".16"/>
    </filter>
    <symbol id="warbler" viewBox="0 0 120 70">
      <path d="M7 40c21-20 53-28 88-18-9 19-30 34-58 35-13 0-22-5-30-17Z" fill="#f1c845"/>
      <path d="M38 18c22-10 48-7 74 13-27 1-50 8-70 21Z" fill="#425d45"/>
      <path d="M93 29l22 3-20 8Z" fill="#203027"/>
      <circle cx="81" cy="25" r="4" fill="#16241d"/>
    </symbol>
    <symbol id="oriole" viewBox="0 0 130 78">
      <path d="M8 44c24-25 61-32 100-18-10 23-36 39-69 39-15 0-24-6-31-21Z" fill="#e9912f"/>
      <path d="M43 17c25-12 56-7 82 16-31 0-57 9-79 24Z" fill="#181b18"/>
      <path d="M103 31l24 4-22 9Z" fill="#1a201d"/>
      <circle cx="91" cy="27" r="4" fill="#fff7df"/>
    </symbol>
    <symbol id="tanager" viewBox="0 0 126 74">
      <path d="M9 43c25-24 58-31 98-17-12 23-38 39-71 39-13 0-22-7-27-22Z" fill="#d73d32"/>
      <path d="M42 17c23-10 52-6 79 16-29 0-54 9-76 23Z" fill="#5a2020"/>
      <path d="M101 31l23 4-21 9Z" fill="#2a1b18"/>
      <circle cx="88" cy="27" r="4" fill="#211713"/>
    </symbol>
    <symbol id="bunting" viewBox="0 0 124 74">
      <path d="M8 43c23-23 57-31 96-18-11 22-36 38-68 39-15 0-24-7-28-21Z" fill="#2368a8"/>
      <path d="M44 18c24-11 52-5 77 16-30 0-55 9-77 23Z" fill="#29a166"/>
      <path d="M17 42c20-10 42-8 64 4-20 9-38 16-58 15Z" fill="#c63b4a"/>
      <path d="M98 31l23 4-21 9Z" fill="#20291f"/>
      <circle cx="86" cy="27" r="4" fill="#fff3d6"/>
    </symbol>
  </defs>

  <rect width="900" height="560" rx="48" fill="url(#sky)"/>
  <circle cx="744" cy="126" r="62" fill="#e2b45a" opacity=".88"/>
  <path d="M70 145c85-58 153-58 238 0 86 58 157 58 243 0 80-54 150-58 226-11" fill="none" stroke="#6fa4ad" stroke-width="8" stroke-linecap="round" opacity=".76"/>
  <path d="M92 205c111-54 216-49 316 15 103 66 223 70 359 12" fill="none" stroke="#7ab0b5" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <path d="M150 274c83-38 160-34 232 11 72 46 163 52 274 18" fill="none" stroke="#8db8aa" stroke-width="7" stroke-linecap="round" opacity=".58"/>

  <g filter="url(#softShadow)">
    <use href="#warbler" x="96" y="262" width="188" height="110" transform="rotate(-7 190 317)"/>
    <use href="#oriole" x="526" y="232" width="178" height="108" transform="rotate(5 615 286)"/>
    <use href="#tanager" x="346" y="116" width="150" height="92" transform="rotate(-4 421 162)"/>
    <use href="#bunting" x="228" y="184" width="144" height="88" transform="rotate(9 300 228)"/>
    <use href="#warbler" x="642" y="72" width="126" height="74" transform="rotate(-11 705 109)"/>
  </g>

  <path d="M0 376c105-65 220-88 338-67 115 21 174 83 296 61 98-18 166-74 266-64v254H0Z" fill="url(#hillA)" opacity=".9"/>
  <path d="M0 442c142-46 281-43 417 9 123 46 255 43 483-28v137H0Z" fill="url(#hillB)"/>
  <path d="M74 390c45-14 84-13 119 1" fill="none" stroke="#f6e4b8" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <path d="M650 374c62-20 112-18 160 4" fill="none" stroke="#f6e4b8" stroke-width="5" stroke-linecap="round" opacity=".42"/>
</svg>
