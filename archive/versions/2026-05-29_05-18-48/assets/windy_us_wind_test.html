<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live U.S. Wind Map Test</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background:#111; color:#eee; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    iframe { width: 100%; height: 620px; border: 0; border-radius: 10px; background:#000; }
    p { color:#bbb; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Live U.S. Surface Wind Map</h1>
    <iframe
      src="https://embed.windy.com/embed2.html?lat=38.5&lon=-97.5&zoom=4&level=surface&overlay=wind&product=ecmwf&calendar=now&metricWind=mph&metricTemp=%C2%B0F&type=map&menu=&message=true&marker=&pressure=true&location=coordinates&detail=&radarRange=-1"
      allowfullscreen>
    </iframe>
    <p>If the map does not load locally, check your browser privacy/ad-block settings or network restrictions.</p>
  </div>
</body>
</html>
